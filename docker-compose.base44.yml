# Base44 sandbox runbook for APAX 3.0.
# Runs the repo's own zero-dependency Python program straight from the
# bind-mounted source; nothing is installed and no prebuilt image is used,
# so edits to apax.py are visible after a service restart.
#
#   docker compose -f docker-compose.base44.yml up -d
#
# Preview: container port 8080 (the app's documented UI port) -> host 3000.
services:
  apax:
    image: python:3.12-slim
    working_dir: /app
    # `--ui` = the stdlib web UI (chat, caps, brain stats). `-u` = unbuffered
    # logs so `docker compose logs -f apax` shows activity live.
    command: ["python3", "-u", "apax.py", "--ui", "8080"]
    volumes:
      - ./:/app
    ports:
      - "3000:8080"
    restart: on-failure
    healthcheck:
      # python3 is the only tool in the image -- probe the UI page directly.
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request
          try:
              r = urllib.request.urlopen("http://127.0.0.1:8080/", timeout=3)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6
